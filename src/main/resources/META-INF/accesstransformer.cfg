# Project Hivemind access transformers.

# The client outlines mobs that are targets of a command or of an open menu, by turning on the glow flag locally.
# Entity#setGlowingTag cannot do that on the client (it re-applies the flag it already has), so open up the flag setter.
public net.minecraft.world.entity.Entity setSharedFlag(IZ)V

# The game only spawns mobs near a player who is not in spectator mode, so the spawning in HivemindManager lets the camera
# pass for one for the moment it takes to spawn. That is done by setting the mode directly, with no packets and no events.
public net.minecraft.server.level.ServerPlayerGameMode gameModeForPlayer

# The hive's health, armor and hearts are drawn by the game's own survival HUD layers (so that mods that change how hearts look apply to them too).
# Those only draw for a survival player, so the game mode the client is shown is switched for the moment they take (see HiveHudLayers).
public net.minecraft.client.multiplayer.MultiPlayerGameMode localPlayerMode
