# Project Hivemind access transformers.

# The client outlines mobs that are targets of a command or of an open menu, by turning on the glow flag locally.
# Entity#setGlowingTag cannot do that on the client (it re-applies the flag it already has), so open up the flag setter.
public net.minecraft.world.entity.Entity setSharedFlag(IZ)V

# The game only spawns mobs near a player who is not in spectator mode, so the spawning in HivemindManager lets the camera
# pass for one for the moment it takes to spawn. That is done by setting the mode directly, with no packets and no events.
public net.minecraft.server.level.ServerPlayerGameMode gameModeForPlayer

# The hive menu's workstations are laid out in a scrolling list, so the screen moves their slots.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y

# Scouts fire bows with the game's own code, and the player's first-person hands show what a scout is using
public net.minecraft.world.item.ProjectileWeaponItem shoot(Lnet/minecraft/server/level/ServerLevel;Lnet/minecraft/world/entity/LivingEntity;Lnet/minecraft/world/InteractionHand;Lnet/minecraft/world/item/ItemStack;Ljava/util/List;FFZLnet/minecraft/world/entity/LivingEntity;)V
public net.minecraft.world.item.ProjectileWeaponItem draw(Lnet/minecraft/world/item/ItemStack;Lnet/minecraft/world/item/ItemStack;Lnet/minecraft/world/entity/LivingEntity;)Ljava/util/List;
public net.minecraft.world.entity.LivingEntity useItem
public net.minecraft.world.entity.LivingEntity useItemRemaining
public net.minecraft.world.entity.LivingEntity setLivingEntityFlag(IZ)V
